<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Overpass Test</title>
<style>
  body { font-family: system-ui; padding: 16px; line-height: 1.5; }
  pre { background: #f0f0f0; padding: 12px; border-radius: 8px; white-space: pre-wrap; word-break: break-all; font-size: 12px; }
  button { padding: 14px 20px; font-size: 15px; margin: 6px 0; border-radius: 10px; border: 0; background: #2d6a4f; color: white; font-weight: bold; width: 100%; }
</style>
</head>
<body>
<h1>Test 3 mirrors — μόνο pharmacy</h1>
<button data-url="https://overpass.kumi.systems/api/interpreter">Kumi</button>
<button data-url="https://overpass.private.coffee/api/interpreter">private.coffee</button>
<button data-url="https://overpass-api.de/api/interpreter">overpass-api.de</button>
<pre id="output">Πάτα ένα κουμπί...</pre>

<script>
const out = document.getElementById("output");

document.querySelectorAll("button").forEach(b => {
  b.addEventListener("click", async () => {
    const url = b.dataset.url;
    out.textContent = "Δοκιμή " + url + "...\n";
    const query = `[out:json][timeout:25];node[amenity=pharmacy](around:500,37.9838,23.7275);out 20;`;
    try {
      const start = Date.now();
      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: "data=" + encodeURIComponent(query)
      });
      out.textContent += "HTTP " + res.status + " (" + (Date.now()-start) + "ms)\n";
      const text = await res.text();
      out.textContent += "Length: " + text.length + "\n";
      out.textContent += text.slice(0, 200);
      if (text.includes('"elements"')) {
        const data = JSON.parse(text);
        out.textContent += "\n✅ Elements: " + data.elements.length;
      } else {
        out.textContent += "\n❌ No elements field";
      }
    } catch (err) {
      out.textContent += "❌ " + err.message;
    }
  });
});
</script>
</body>
</html>
