<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Debug</title>
<style>
  body { font-family: monospace; padding: 16px; font-size: 13px; line-height: 1.6; }
  pre { background: #f5f5f5; padding: 12px; border-radius: 8px; white-space: pre-wrap; word-break: break-all; }
  .ok { color: #080; font-weight: bold; }
  .err { color: #c00; font-weight: bold; }
</style>
</head>
<body>
<pre id="out">Φόρτωση...</pre>

<script>
window.addEventListener("error", function(e) {
  var el = document.getElementById("out");
  el.innerHTML += "\n\n🔴 ΣΦΑΛΜΑ:\n" +
    (e.message || "unknown") + "\n" +
    "File: " + (e.filename || "?") + "\n" +
    "Line: " + (e.lineno || "?") + "\n";
});

window.onload = function() {
  var t = [];
  function chk(n, v) {
    t.push((typeof v !== "undefined" && v !== null ? "✅ " : "❌ ") + n + ": " + typeof v);
  }

  t.push("═══ data.js ═══");
  chk("CARD_CATEGORIES", window.CARD_CATEGORIES);
  chk("TAGS", window.TAGS);
  chk("MAP_LOCATIONS", window.MAP_LOCATIONS);
  chk("REMOTE_SERVICES", window.REMOTE_SERVICES);
  chk("CUSTOM_CARD_MAX_LENGTH", window.CUSTOM_CARD_MAX_LENGTH);
  chk("getCustomCards", window.getCustomCards);
  chk("saveCustomCard", window.saveCustomCard);
  chk("getFavorites", window.getFavorites);
  chk("saveFavorite", window.saveFavorite);
  chk("updateFavorite", window.updateFavorite);
  chk("deleteFavorite", window.deleteFavorite);
  chk("getResponses", window.getResponses);
  chk("saveResponse", window.saveResponse);
  chk("filterResponsesByDate", window.filterResponsesByDate);
  chk("filterFavoritesByTags", window.filterFavoritesByTags);
  chk("sortFavoritesAlphabetically", window.sortFavoritesAlphabetically);

  t.push("");
  t.push("═══ locations scripts ═══");
  chk("EXTRA_LOCATIONS", window.EXTRA_LOCATIONS);
  chk("COORD_OVERRIDES", window.COORD_OVERRIDES);

  t.push("");
  t.push("═══ app.js ═══");
  chk("init", window.init);
  chk("render", window.render);
  chk("renderHome", window.renderHome);
  chk("openProtocol", window.openProtocol);

  document.getElementById("out").textContent = t.join("\n");
};
</script>

<script src="data.js"></script>
<script src="locations-extra.js"></script>
<script src="locations-coords.js"></script>
<script src="app.js"></script>

</body>
</html>
