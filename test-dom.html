<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Test DOM</title>
<style>
  body { font-family: monospace; padding: 12px; font-size: 12px; line-height: 1.5; }
  pre { background: #f5f5f5; padding: 10px; border-radius: 6px; white-space: pre-wrap; word-break: break-all; }
</style>
</head>
<body>
<pre id="out">Φόρτωση...</pre>

<script>
window.addEventListener("error", function(e) {
  document.getElementById("out").textContent +=
    "\n\n🔴 ΣΦΑΛΜΑ:\n" + (e.message || "?") + "\nFile: " + (e.filename || "?") + "\nLine: " + (e.lineno || "?");
});

window.addEventListener("unhandledrejection", function(e) {
  document.getElementById("out").textContent += "\n\n🔴 PROMISE: " + (e.reason && e.reason.message);
});

window.addEventListener("load", function() {
  var t = [];

  // 1. Έλεγχος IDs
  t.push("═══ DOM IDs στο τρέχον HTML ═══");
  var ids = [
    "content", "screen-title", "back-btn", "add-custom-btn", "toast",
    "header-logo", "header-subtitle",
    "fullscreen", "fullscreen-label", "fullscreen-text", "fullscreen-close",
    "response-dialog", "response-stage-1", "response-stage-2",
    "response-fullscreen", "response-save", "response-done",
    "add-dialog", "fav-dialog", "confirm-dialog", "confirm-ok", "confirm-cancel",
    "tab-cards", "tab-favorites", "tab-map", "tab-transcribe",
    "print-area"
  ];
  var missing = 0;
  ids.forEach(function(id) {
    if (document.getElementById(id)) {
      // ok
    } else {
      t.push("❌ " + id);
      missing++;
    }
  });
  t.push(missing === 0 ? "✅ Όλα τα IDs υπάρχουν" : "⚠️ " + missing + " λείπουν");

  // 2. Έλεγχος data
  t.push("\n═══ Δεδομένα ═══");
  try {
    t.push("CARD_CATEGORIES: " + (typeof CARD_CATEGORIES !== "undefined" ? "✅ (" + CARD_CATEGORIES.length + ")" : "❌"));
  } catch (e) { t.push("CARD_CATEGORIES: ❌ " + e.message); }
  try {
    t.push("TAGS: " + (typeof TAGS !== "undefined" ? "✅ (" + TAGS.length + ")" : "❌"));
  } catch (e) { t.push("TAGS: ❌ " + e.message); }
  try {
    t.push("REMOTE_SERVICES: " + (typeof REMOTE_SERVICES !== "undefined" ? "✅ (" + REMOTE_SERVICES.length + ")" : "❌"));
  } catch (e) { t.push("REMOTE_SERVICES: ❌ " + e.message); }

  // 3. Χειροκίνητη κλήση init
  t.push("\n═══ Δοκιμή init() ═══");
  try {
    if (typeof init === "function") {
      t.push("init υπάρχει ✅");
      // Μην το καλέσουμε γιατί μπορεί να σκάσει
      // Αλλά δοκίμασε να δεις αν θα τρέξει render
      try {
        if (typeof render === "function") {
          render(VIEWS.HOME, false);
          t.push("render(HOME) ✅");
          var content = document.getElementById("content");
          var children = content ? content.children.length : 0;
          t.push("Παιδιά στο #content: " + children);
        } else {
          t.push("render ❌ δεν είναι function");
        }
      } catch (e) {
        t.push("render ΣΦΑΛΜΑ: " + e.message);
        t.push(e.stack ? e.stack.split("\n").slice(0, 3).join("\n") : "");
      }
    } else {
      t.push("init ❌ δεν είναι function — το app.js ΔΕΝ έτρεξε");
    }
  } catch (e) {
    t.push("init ΣΦΑΛΜΑ: " + e.message);
  }

  document.getElementById("out").textContent = t.join("\n");
});
</script>

<script src="data.js"></script>
<script src="locations-extra.js"></script>
<script src="locations-coords.js"></script>
<script src="app.js"></script>
</body>
</html>
