<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2d6a4f" />
  <meta name="description" content="Δίαυλος: κάρτες συζήτησης για κωφούς και βαρήκοους. Έτοιμες φράσεις με μεγάλα γράμματα και ανάγνωση φωνητικά. Λειτουργεί και χωρίς σύνδεση." />

  <!-- iOS / Android PWA -->
  <link rel="apple-touch-icon" href="icon-192.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Δίαυλος" />

  <title>Δίαυλος — Προσβάσιμη Επικοινωνία</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <button id="back-btn" type="button" hidden aria-label="Πίσω">←</button>
    <h1 id="screen-title" tabindex="-1">Κάρτες Συζήτησης</h1>
  </header>

  <main id="content">
    <noscript>
      <p class="empty-state">Για να λειτουργήσει ο Δίαυλος χρειάζεται JavaScript. Ενεργοποίησέ το στον browser σου.</p>
    </noscript>
  </main>

  <button id="add-custom-btn" type="button" hidden aria-label="Προσθήκη κάρτας">+</button>

  <!-- Μήνυμα κατάστασης (οπτικό, όχι μόνο ηχητικό) -->
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <!-- Προσθήκη προσωπικής κάρτας -->
  <dialog id="add-dialog" aria-labelledby="add-dialog-title">
    <form id="add-form" novalidate>
      <h2 id="add-dialog-title">Νέα κάρτα</h2>
      <label for="add-text">Γράψε τη φράση</label>
      <textarea id="add-text" rows="4" maxlength="300" required></textarea>
      <p id="add-error" class="form-error" role="alert" hidden></p>
      <div class="dialog-actions">
        <button type="button" id="add-cancel" class="btn-secondary">Ακύρωση</button>
        <button type="submit" class="btn-primary">Αποθήκευση</button>
      </div>
    </form>
  </dialog>

  <!-- Επιβεβαίωση διαγραφής -->
  <dialog id="confirm-dialog" aria-labelledby="confirm-title">
    <h2 id="confirm-title">Διαγραφή κάρτας;</h2>
    <p id="confirm-text" class="confirm-text"></p>
    <div class="dialog-actions">
      <button type="button" id="confirm-cancel" class="btn-secondary">Ακύρωση</button>
      <button type="button" id="confirm-ok" class="btn-danger">Διαγραφή</button>
    </div>
  </dialog>

  <nav class="tabbar" aria-label="Κύρια πλοήγηση">
    <button type="button" class="tab active" aria-current="page">
      <span class="tab-icon" aria-hidden="true">💬</span>
      Κάρτες
    </button>
    <button type="button" class="tab" disabled>
      <span class="tab-icon" aria-hidden="true">⭐</span>
      Αγαπημένα
      <span class="visually-hidden">(έρχεται σύντομα)</span>
    </button>
    <button type="button" class="tab" disabled>
      <span class="tab-icon" aria-hidden="true">🗺️</span>
      Χάρτης
      <span class="visually-hidden">(έρχεται σύντομα)</span>
    </button>
    <button type="button" class="tab" disabled>
      <span class="tab-icon" aria-hidden="true">🎙️</span>
      Μεταγραφή
      <span class="visually-hidden">(έρχεται σύντομα)</span>
    </button>
  </nav>

  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(console.error);
      });
    }
  </script>
</body>
</html>
