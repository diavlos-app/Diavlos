<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Test Live</title>
</head>
<body>
<pre id="log" style="font-family:monospace;font-size:11px;background:#f0f0f0;padding:10px;white-space:pre-wrap"></pre>
<script>
var log = [];
function L(s) {
  log.push(s);
  document.getElementById("log").textContent = log.join("\n");
}

L("═══ Έναρξη test ═══");

window.addEventListener("error", function(e) {
  L("");
  L("🔴 ΣΦΑΛΜΑ:");
  L("  " + (e.message || "?"));
  L("  File: " + (e.filename || "?"));
  L("  Line: " + (e.lineno || "?"));
});

window.addEventListener("unhandledrejection", function(e) {
  L("🔴 PROMISE: " + (e.reason && e.reason.message));
});

// Φόρτωσε το index.html σε iframe
L("");
L("Φόρτωση index.html σε iframe...");

var iframe = document.createElement("iframe");
iframe.style.width = "1px";
iframe.style.height = "1px";
iframe.style.opacity = "0";
iframe.style.position = "absolute";
iframe.style.left = "-9999px";
iframe.src = "index.html";

iframe.onload = function() {
  L("✅ iframe φόρτωσε");

  var w = iframe.contentWindow;
  var d = iframe.contentDocument;

  // Έλεγχος #content
  var content = d.getElementById("content");
  L("  #content βρέθηκε: " + (content ? "ΝΑΙ" : "ΟΧΙ"));
  if (content) {
    L("  Παιδιά: " + content.children.length);
  }

  // Έλεγχος init στο iframe
  try {
    L("");
    L("Δοκιμή init() μέσω iframe...");
    var fn = w.eval("typeof init");
    L("  typeof init (μέσα στο iframe): " + fn);

    if (fn === "function") {
      L("  Καλείται init()...");
      try {
        w.eval("init()");
        L("  ✅ init() OK");
        L("  #content παιδιά μετά init: " + content.children.length);
      } catch (e) {
        L("  🔴 init ΣΦΑΛΜΑ: " + e.message);
        L("  " + (e.stack || "").split("\n").slice(0, 4).join("\n  "));
      }
    }
  } catch (e) {
    L("  🔴 eval error: " + e.message);
  }

  L("");
  L("═══ Τέλος ═══");
};

document.body.appendChild(iframe);
</script>
</body>
</html>
