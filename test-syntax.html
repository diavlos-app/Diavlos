<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Test Syntax</title>
<style>
  body { font-family: monospace; padding: 16px; font-size: 13px; line-height: 1.6; }
  pre { background: #f5f5f5; padding: 12px; border-radius: 8px; white-space: pre-wrap; word-break: break-all; }
</style>
</head>
<body>
<pre id="out">Φόρτωση...</pre>

<script>
const out = document.getElementById("out");

const files = [
  "data.js",
  "locations-extra.js",
  "locations-coords.js",
  "app.js",
  "transcribe.js"
];

(async () => {
  let report = "";
  for (const file of files) {
    report += "════ " + file + " ════\n";
    try {
      const r = await fetch(file, { cache: "no-store" });
      if (!r.ok) {
        report += "❌ HTTP " + r.status + "\n\n";
        continue;
      }
      const text = await r.text();
      const lines = text.split("\n").length;
      report += "Μέγεθος: " + text.length + " chars, " + lines + " γραμμές\n";

      // Δοκίμασε να το κάνεις compile σαν function
      try {
        new Function(text);
        report += "✅ ΣΥΝΤΑΞΗ ΕΝΤΑΞΕΙ\n\n";
      } catch (e) {
        report += "🔴 SYNTAX ERROR: " + e.message + "\n\n";
      }
    } catch (e) {
      report += "❌ " + e.message + "\n\n";
    }
  }
  out.textContent = report;
})();
</script>
</body>
</html>
